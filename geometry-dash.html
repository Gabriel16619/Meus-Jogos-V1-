<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Clone</title>
    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        canvas {
            background: linear-gradient(#0052d4, #4364f7, #6fb1fc);
            border: 4px solid #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const floorY = canvas.height - 80;

        // Configurações do Cubo (Jogador)
        const player = {
            x: 100,
            y: floorY - 40,
            size: 40,
            gravity: 0.9,
            jumpForce: -15,
            velocity: 0,
            isGrounded: true,
            rotation: 0
        };

        // Obstáculos (Espinhos e Blocos)
        const obstacles = [];
        const obstacleSpeed = 6;
        let frameCount = 0;
        let score = 0;
        let gameOver = false;

        // Controles (Espaço, Seta para Cima ou Clique)
        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "ArrowUp") jump();
        });
        canvas.addEventListener("mousedown", jump);

        function jump() {
            if (gameOver) {
                resetGame();
            } else if (player.isGrounded) {
                player.velocity = player.jumpForce;
                player.isGrounded = false;
            }
        }

        function resetGame() {
            player.y = floorY - player.size;
            player.velocity = 0;
            player.isGrounded = true;
            player.rotation = 0;
            obstacles.length = 0;
            score = 0;
            frameCount = 0;
            gameOver = false;
            gameLoop();
        }

        function spawnObstacle() {
            // Alterna aleatoriamente entre um espinho (triângulo) ou um bloco quadrado
            const type = Math.random() > 0.5 ? "spike" : "block";
            obstacles.push({
                x: canvas.width,
                y: floorY,
                width: 35,
                height: 40,
                type: type,
                passed: false
            });
        }

        function update() {
            if (gameOver) return;

            // Aplica gravidade ao jogador
            player.velocity += player.gravity;
            player.y += player.velocity;

            // Colisão com o chão
            if (player.y >= floorY - player.size) {
                player.y = floorY - player.size;
                player.velocity = 0;
                player.isGrounded = true;
                // Alinha a rotação ao quadrado mais próximo quando toca o chão (multiplos de 90 graus)
                player.rotation = Math.round(player.rotation / 90) * 90;
            } else {
                // Rotaciona enquanto estiver no ar
                player.rotation += 5;
            }

            // Geração de obstáculos baseada no tempo/frames
            if (frameCount % 90 === 0) {
                spawnObstacle();
            }

            // Atualiza obstáculos
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= obstacleSpeed;

                // Caixa de colisão aproximada
                const pLeft = player.x;
                const pRight = player.x + player.size;
                const pTop = player.y;
                const pBottom = player.y + player.size;

                const oLeft = obstacles[i].x;
                const oRight = obstacles[i].x + obstacles[i].width;
                const oTop = obstacles[i].y - obstacles[i].height;
                const oBottom = obstacles[i].y;

                // Verifica intersecção AABB (Colisão básica)
                if (pRight > oLeft && pLeft < oRight && pBottom > oTop && pTop < oBottom) {
                    gameOver = true;
                }

                // Incrementa pontuação
                if (!obstacles[i].passed && oRight < player.x) {
                    score++;
                    obstacles[i].passed = true;
                }

                // Remove da memória se saiu da tela
                if (oRight < 0) {
                    obstacles.splice(i, 1);
                }
            }

            frameCount++;
        }

        function draw() {
            // Limpa a tela
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenha o Chão
            ctx.fillStyle = "#222";
            ctx.fillRect(0, floorY, canvas.width, canvas.height - floorY);
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, floorY);
            ctx.lineTo(canvas.width, floorY);
            ctx.stroke();

            // Desenha os Obstáculos
            obstacles.forEach(obs => {
                ctx.fillStyle = "#e74c3c"; // Vermelho neon para perigo
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 2;

                if (obs.type === "spike") {
                    // Desenha Triângulo (Espinho)
                    ctx.beginPath();
                    ctx.moveTo(obs.x, obs.y);
                    ctx.lineTo(obs.x + obs.width / 2, obs.y - obs.height);
                    ctx.lineTo(obs.x + obs.width, obs.y);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                } else {
                    // Desenha Bloco Quadrado
                    ctx.fillRect(obs.x, obs.y - obs.height, obs.width, obs.height);
                    ctx.strokeRect(obs.x, obs.y - obs.height, obs.width, obs.height);
                }
            });

            // Desenha o Jogador (Cubo com Rotação)
            ctx.save();
            // Move o ponto de origem para o centro do cubo
            ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
            ctx.rotate((player.rotation * Math.PI) / 180);

            // Rosto/Design icônico do Cubo Geometry Dash
            ctx.fillStyle = "#ffff00"; // Amarelo clássico
            ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 3;
            ctx.strokeRect(-player.size / 2, -player.size / 2, player.size, player.size);

            // Olhos internos (Quadrados pretos)
            ctx.fillStyle = "#000";
            ctx.fillRect(-12, -12, 8, 8);
            ctx.fillRect(4, -12, 8, 8);
            // Boca
            ctx.fillRect(-10, 4, 20, 6);

            ctx.restore();

            // Pontuação na tela
            ctx.fillStyle = "#fff";
            ctx.font = "bold 24px Arial";
            ctx.textAlign = "left";
            ctx.fillText("Obstáculos passados: " + score, 20, 40);

            // Tela de Game Over
            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#fff";
                ctx.textAlign = "center";
                ctx.font = "bold 40px Arial";
                ctx.fillText("💥 TENTATIVA FALHOU! 💥", canvas.width / 2, canvas.height / 2 - 20);

                ctx.font = "20px Arial";
                ctx.fillText("Pressione ESPAÇO ou Clique para tentar novamente", canvas.width / 2, canvas.height / 2 + 30);
            }
        }

        function gameLoop() {
            update();
            draw();
            if (!gameOver) {
                requestAnimationFrame(gameLoop);
            }
        }

        // Inicia o jogo
        gameLoop();
    </script>
</body>
</html>
